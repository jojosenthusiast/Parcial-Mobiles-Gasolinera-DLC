<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf5ec"><title>DLC · Operaciones</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/analytics.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <div id="login" class="login-shell" hidden>
    <div class="login-card">
      <div class="login-brand"><img src="/assets/dlc-wordmark.png" alt="DLC Gasolineras" width="210" height="70"></div>
      <p class="eyebrow">Gestión de estaciones</p><h1>Iniciar sesión</h1><p class="muted">Acceso seguro para gerencia y operación.</p>
      <form id="login-form" data-validate="messages"><label>Correo electrónico<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required minlength="1"></label>
        <button class="btn btn-create wide" type="submit"><span>Entrar</span><svg class="icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-chevron-right"/></svg></button><p id="login-error" class="error" role="alert"></p>
      </form><small>Los permisos y sucursales disponibles dependen de tu cuenta.</small>
    </div>
  </div>
  <div id="shell" class="shell" hidden>
    <a class="skip-link" href="#content">Saltar al contenido</a>
    <aside class="sidebar"><a class="brand" href="#dashboard" aria-label="DLC, ir al resumen"><span class="brand-plate"><img class="brand-wordmark" src="/assets/dlc-wordmark.png" alt="DLC" width="132" height="44"></span></a>
      <nav id="navigation" aria-label="Módulos de operación"></nav>
      <div class="sidebar-bottom"><button type="button" class="user-chip" id="user-menu-button" aria-haspopup="menu" aria-expanded="false" aria-label="Menú de perfil"><span class="avatar" id="avatar" aria-hidden="true">D</span><span class="who"><b id="user-name">Usuario</b><small id="user-role">DLC</small></span><svg class="icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-chevron-up"/></svg></button></div>
    </aside>
    <main>
      <div class="scopebar-wrap"><div id="scopebar" class="scopebar" role="group" aria-label="Alcance de los datos"></div><div class="top-actions"><span class="live-dot" id="live-status">En línea</span><button type="button" class="icon-button" id="refresh" aria-label="Actualizar datos" title="Actualizar datos"><svg class="icon" width="20" height="20" aria-hidden="true" focusable="false"><use href="#i-refresh"/></svg></button></div></div>
      <header class="topbar"><div><div class="eyebrow" id="scope-label">DLC · Gestión</div><h1 id="page-title">Resumen</h1></div></header>
      <div id="module-banner"></div>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body></html>
