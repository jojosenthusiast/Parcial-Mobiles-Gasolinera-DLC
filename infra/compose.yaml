name: dlc-gasolineras
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: dlc_dev
      POSTGRES_USER: dlc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored root .env file}
      TZ: America/El_Salvador
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dlc-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlc -d dlc_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://dlc:${POSTGRES_PASSWORD}@postgres:5432/dlc_dev
      ADMIN_DATABASE_URL: postgresql://dlc:${POSTGRES_PASSWORD}@postgres:5432/dlc_dev
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?Set a 32+ character hex password in the ignored root .env file}
      LOCAL_DATABASE_SETUP: "true"
      DATABASE_SSL_MODE: disable
    command: ["sh", "-lc", "node scripts/migrate.mjs && node scripts/configure-local-runtime-role.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DISPENSE_ADAPTER_MODE: manual
      DATABASE_URL: postgresql://dlc_api_local:${RUNTIME_DATABASE_PASSWORD}@postgres:5432/dlc_dev
      DATABASE_POOL_MAX: 10
      DATABASE_SSL_MODE: disable
      CORS_ORIGINS: http://localhost:4173
      TRUST_PROXY_HOPS: 0
      AUTH_RATE_LIMIT_KEY: ${AUTH_RATE_LIMIT_KEY:?Set a 32+ character random value in the ignored root .env file}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["node", "dist/reports/worker.main.js"]
    environment:
      NODE_ENV: development
      DISPENSE_ADAPTER_MODE: manual
      DATABASE_URL: postgresql://dlc_api_local:${RUNTIME_DATABASE_PASSWORD}@postgres:5432/dlc_dev
      DATABASE_POOL_MAX: 5
      DATABASE_SSL_MODE: disable
      AUTH_RATE_LIMIT_KEY: ${AUTH_RATE_LIMIT_KEY:?Set a 32+ character random value in the ignored root .env file}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4173
      WEB_API_BASE_URL: http://api:4000/api/v1
      WEB_SESSION_KEY: ${WEB_SESSION_KEY:?Set a 32+ byte random value in the ignored root .env file}
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dlc-postgres:
